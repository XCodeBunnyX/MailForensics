  <!-- Main CSS -->
  <link rel="stylesheet" href="css/main.css?v=20260922_viewport_100zoom_fit">

  <style>
    /* Splash / Loading Screen */
    #splash {
      position: fixed;
      inset: 0;
      background: #060b16;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      z-index: 99999;
      transition: opacity 0.6s ease;
    }
    #splash.fade-out { opacity: 0; pointer-events: none; }
    .splash-logo {
      font-size: 64px;
      font-weight: 900;
      letter-spacing: 12px;
      background: linear-gradient(135deg, #00d4ff, #7c3aed);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
      margin-bottom: 8px;
      animation: splashPulse 2s ease-in-out infinite;
    }
    @keyframes splashPulse {
      0%,100% { filter: brightness(1); }
      50% { filter: brightness(1.3) drop-shadow(0 0 20px #00d4ff60); }
    }
    .splash-tagline { font-size: 14px; color: #4a5568; letter-spacing: 3px; text-transform: uppercase; margin-bottom: 48px; }
    .splash-loader {
      width: 200px; height: 3px;
      background: #1e293b;
      border-radius: 3px;
      overflow: hidden;
    }
    .splash-loader-fill {
      height: 100%;
      background: linear-gradient(90deg, #00d4ff, #7c3aed);
      border-radius: 3px;
      animation: splashLoad 1.8s ease-out forwards;
    }
    @keyframes splashLoad { from { width: 0; } to { width: 100%; } }
    .splash-status { font-size: 11px; color: #2d3748; margin-top: 12px; letter-spacing: 2px; text-transform: uppercase; animation: fadeIn 0.5s 0.5s both; }

    /* Particle background */
    #particles { position: fixed; inset: 0; pointer-events: none; z-index: 0; overflow: hidden; }
    .particle {
      position: absolute;
      width: 2px; height: 2px;
      background: #00d4ff;
      border-radius: 50%;
      opacity: 0;
      animation: particleFloat linear infinite;
    }
    @keyframes particleFloat {
      0% { transform: translateY(100vh) translateX(0); opacity: 0; }
      10% { opacity: 0.4; }
      90% { opacity: 0.2; }
      100% { transform: translateY(-20px) translateX(calc(var(--drift, 0) * 1px)); opacity: 0; }
    }
  </style>
</head>
<body>
  <!-- Splash Screen -->
  <div id="splash">
    <div style="text-align:center">
      <div class="splash-logo">⬡ GmailGuard</div>
      <div class="splash-tagline">See Beyond the Inbox — Email Forensics Platform</div>
      <div style="font-size:11px;color:#2d3748;letter-spacing:1px;margin-bottom:32px">SIH 2026 — Problem Statement SIH26106 — AICTE</div>
      <div class="splash-loader"><div class="splash-loader-fill"></div></div>
      <div class="splash-status">Connecting to FastAPI forensic intelligence engine...</div>
    </div>
  </div>

  <!-- Particle Background -->
  <div id="particles"></div>

  <!-- Main App Layout -->
  <div class="app-layout">
    <aside id="sidebar" class="sidebar"></aside>
    <main id="main-content" class="main-content"></main>
  </div>

  <!-- Scripts (Cache Buster v8 - 100% Zoom & Viewport Fit Fix) -->
  <script src="js/api.js?v=20260922_viewport_100zoom_fit"></script>
  <script src="js/models.js?v=20260922_viewport_100zoom_fit"></script>
  <script src="js/data.js?v=20260922_viewport_100zoom_fit"></script>
  <script src="js/graph.js?v=20260922_viewport_100zoom_fit"></script>
  <script src="js/report.js?v=20260922_viewport_100zoom_fit"></script>
  <script src="js/app.js?v=20260922_viewport_100zoom_fit"></script>

  <script>
    // ── Splash dismissal — ALWAYS fires, never blocks on CDN ──
    function dismissSplash() {
      var splash = document.getElementById('splash');
      if (splash && !splash._dismissed) {
        splash._dismissed = true;
        splash.classList.add('fade-out');
        setTimeout(function() { splash.remove(); }, 700);
      }
    }
    // Dismiss after 2.5s no matter what — don't wait for external CDN resources
    setTimeout(dismissSplash, 2500);
    // Also dismiss on window load (fires earlier if everything loads fast)
    window.addEventListener('load', function() { setTimeout(dismissSplash, 300); });

    // ── App bootstrap with error boundary ─────────────────────
    window.addEventListener('DOMContentLoaded', function() {
      try {
        window.app = new GmailGuardApp();
        window.app.init();
      } catch (err) {
        console.error('GmailGuard: App init failed:', err);
        // Force splash away and show error message so user doesn't see black screen
        dismissSplash();
        var main = document.getElementById('main-content');
        if (main) {
          main.innerHTML =
            '<div style="padding:60px 40px;text-align:center;color:#e2e8f0">' +
              '<div style="font-size:48px;margin-bottom:16px">⚠️</div>' +
              '<h2 style="margin-bottom:12px;color:#ff6b35">Application Failed to Initialize</h2>' +
              '<p style="color:#94a3b8;max-width:500px;margin:0 auto 20px;line-height:1.6">' +
                'A JavaScript error prevented GmailGuard from loading. ' +
                'Please check the browser console (F12) for details.</p>' +
              '<pre style="background:#111827;border:1px solid #1e2d45;padding:16px;border-radius:8px;' +
                'color:#ff6b35;font-size:12px;max-width:600px;margin:0 auto;text-align:left;overflow-x:auto">' +
                err.message + '</pre>' +
            '</div>';
        }
      }
    });

    // ── Particle system ───────────────────────────────────────
    (function() {
      try {
        var container = document.getElementById('particles');
        if (!container) return;
        var count = 30;
        for (var i = 0; i < count; i++) {
          var p = document.createElement('div');
          p.className = 'particle';
          var x = Math.random() * 100;
          var dur = 12 + Math.random() * 20;
          var delay = Math.random() * 15;
          var size = Math.random() > 0.7 ? 3 : 2;
          var drift = (Math.random() - 0.5) * 100;
          var colors = ['#00d4ff', '#7c3aed', '#4f46e5', '#34d399'];
          var color = colors[Math.floor(Math.random() * colors.length)];
          p.style.cssText =
            'left:' + x + '%;' +
            'width:' + size + 'px;height:' + size + 'px;' +
            'background:' + color + ';' +
            'animation-duration:' + dur + 's;' +
            'animation-delay:' + delay + 's;' +
            '--drift:' + drift;
          container.appendChild(p);
        }
      } catch (_) {}
    })();
  </script>
</body>
</html>
